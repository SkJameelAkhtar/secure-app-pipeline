name: Secure CICD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
    #1 checkout
    - name: Checkout Code
      uses: actions/checkout@v3

    #2 Gitleaks Secret Scan
    - name: Run Gitleaks
      uses: zricethezav/gitleaks-action@v2

    #3 SAST - Semgrep
    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1


    #4 Dependency Scan - Trivy
    - name: Trivy FS Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'table'


    #5 Build Docker Image
    - name: Build Docker Image
      run: docker build -t secure-app .

    #6 Image Scan
    - name: Tr Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'secure-app'
        format: 'table'

    #7 Login to DockerHub
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    #8 Push Image
    - name: Push Docker Image
      run: |
        docker tag secure-app skjam/secure-app
        docker push skjam/secure-app
